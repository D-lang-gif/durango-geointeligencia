# Publica la carpeta sitio/ en la rama gh-pages (GitHub Pages).
# Agrega Leaflet 1.9.4, Leaflet.heat 0.2.0 y Leaflet.markercluster 1.5.3 (v4) descargados de npm y verificados con SHA-256.
name: Publicar sitio en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-sitio
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio con Leaflet verificado
        run: |
          set -euo pipefail
          rm -rf _sitio tmp && cp -r sitio _sitio && mkdir -p _sitio/vendor/leaflet tmp
          curl -fsSL -o tmp/leaflet.tgz https://registry.npmjs.org/leaflet/-/leaflet-1.9.4.tgz
          curl -fsSL -o tmp/heat.tgz https://registry.npmjs.org/leaflet.heat/-/leaflet.heat-0.2.0.tgz
          echo "84c65a256e50657896f54c33bd857b6849ebe94c817803be818bf32a3dde0b77  tmp/leaflet.tgz" | sha256sum -c -
          echo "6d980bce16b6bbe8e3b124d200dfd12964ff8f6bfff44eb3a47344f97dfc5c7f  tmp/heat.tgz" | sha256sum -c -
          curl -fsSL -o tmp/mc.tgz https://registry.npmjs.org/leaflet.markercluster/-/leaflet.markercluster-1.5.3.tgz
          echo "fc6b0b1d00b6c708ae54e43ee4a11ac345e41660e19f0a570190bb35babb1a1c  tmp/mc.tgz" | sha256sum -c -
          tar xzf tmp/mc.tgz -C tmp && mv tmp/package tmp/mc
          mkdir -p _sitio/vendor/markercluster
          cp tmp/mc/dist/MarkerCluster.css tmp/mc/dist/MarkerCluster.Default.css tmp/mc/MIT-LICENCE.txt _sitio/vendor/markercluster/
          sed '/sourceMappingURL/d' tmp/mc/dist/leaflet.markercluster.js > _sitio/vendor/markercluster/leaflet.markercluster.js
          tar xzf tmp/leaflet.tgz -C tmp && mv tmp/package tmp/leaflet
          tar xzf tmp/heat.tgz -C tmp && mv tmp/package tmp/heat
          cp -r tmp/leaflet/dist/leaflet.js tmp/leaflet/dist/leaflet.css tmp/leaflet/dist/images _sitio/vendor/leaflet/
          cp tmp/leaflet/LICENSE _sitio/vendor/leaflet/LICENSE.txt
          cp tmp/heat/dist/leaflet-heat.js _sitio/vendor/leaflet-heat.js
          touch _sitio/.nojekyll
          # v4: app.js = app.js de la v3 + cambios v4 (parche revisable)
          patch -o _sitio/v4/js/app.js sitio/js/app.js herramientas/app_v4.patch
          # v4: paquete cifrado (AES-GCM) guardado en 4 partes; se une y se verifica
          mkdir -p _sitio/v4/datos && cat datos_v4/paquete_parte0.txt datos_v4/paquete_parte1.txt datos_v4/paquete_parte2.txt datos_v4/paquete_parte3.txt > _sitio/v4/datos/paquete.js
          echo "99937902c2469edf6d16081eba1b7a0cf207325b44f4e7be7ce898f1e7622cc6  _sitio/v4/datos/paquete.js" | sha256sum -c -
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Minificar y ofuscar JS propios (sin mapas de código fuente)
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --prefix tmp/ofus javascript-obfuscator@5.9.0
          NODE_PATH=tmp/ofus/node_modules node herramientas/ofuscar.cjs _sitio/js
          NODE_PATH=tmp/ofus/node_modules node herramientas/ofuscar.cjs _sitio/v4/js
          for f in _sitio/js/*.js _sitio/v4/js/*.js; do head -c 200 "$f" | grep -q 'Raúl Muñoz Villa' || { echo "Sin ofuscar: $f"; exit 1; }; node --check "$f"; done
          if find _sitio -iname '*.map' | grep -q .; then echo "Hay mapas de código fuente"; exit 1; fi
          if grep -rl 'sourceMappingURL' _sitio/js _sitio/v4 _sitio/vendor/markercluster --include='*.js' | grep -q .; then echo "Referencia a mapas de código fuente"; exit 1; fi
          test -f _sitio/v4/index.html
          ls -R _sitio
      - name: Publicar en la rama gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _sitio
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar sitio desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
